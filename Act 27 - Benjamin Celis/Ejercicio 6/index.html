<!DOCTYPE html>

    <h2>Examen Multiple Choice</h2>
    <p>1. ¿Cual es la capital de Argentina?</p>
    <select id="p1">
        <option value="incorrecta">Cordoba</option>
        <option value="correcta">Buenos Aires</option>
        <option value="incorrecta">Rosario</option>
    </select>
    <br><br>
    <p>2. ¿Cuanto es 5 x 6?</p>
    <select id="p2">
        <option value="incorrecta">25</option>
        <option value="incorrecta">35</option>
        <option value="correcta">30</option>
    </select>
    <br><br>
    <p>3. ¿Cual es el lenguaje utilizado para los estilos web?</p>
    <select id="p3">
        <option value="correcta">CSS</option>
        <option value="incorrecta">HTML</option>
        <option value="incorrecta">Python</option>
    </select>
    <br><br>
    <p>4. ¿Que etiqueta de HTML se usa para vincular un script de JavaScript?</p>
    <select id="p4">
        <option value="incorrecta">&lt;style&gt;</option>
        <option value="correcta">&lt;script&gt;</option>
        <option value="incorrecta">&lt;link&gt;</option>
    </select>
