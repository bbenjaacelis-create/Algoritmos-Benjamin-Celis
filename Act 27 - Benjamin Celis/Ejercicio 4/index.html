<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selleción de Pizzas</title>
    <script src="./src/script.js"></script>
</head>
<body>
    <form>
        <p>
            <label for="pizza">Selecciona una pizza: </label>
            <select id="pizza" onchange="mostrar()">
                <option value="">-- Seleccionar --</option>
                <option value="12000">Jamón y Queso</option>
                <option value="10000">Muzzarella</option>
                <option value="11500">Morrones</option>
            </select>
        </p>
        <p>
            <label for="precio">Precio de la pizza seleccionada: </label>
            <input type="text" id="precio" readonly>
        </p>
    </form>
</body>
</html>
