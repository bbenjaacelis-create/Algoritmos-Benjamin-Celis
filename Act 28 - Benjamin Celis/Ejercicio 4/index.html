<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./src/scrip.js" defer></script>
</head>
<body>
    <table border="1">
        <tr>
            <td onmouseover="pintar(this, '#f00')" onmouseout="pintar(this, '#fff')" onclick="link('https://mail.google.com')">Gmail</td>
            <td onmouseover="pintar(this, '#0f0')" onmouseout="pintar(this, '#fff')" onclick="link('https://outlook.live.com')">Hotmail</td>
            <td onmouseover="pintar(this, '#8000FF')" onmouseout="pintar(this, '#fff')" onclick="link('https://mail.yahoo.com')">Yahoo!</td>
        </tr>
    </table>
</body>
</html>
